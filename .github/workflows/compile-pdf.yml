name: Generate PDF via Eisvogel

on:
  push:
    branches:
      - main
      - master

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository content
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Convert Markdown to PDF using the pandoc/extra image
      - name: Build PDF
        uses: docker://pandoc/extra:3.8
        with:
          # Note: GitHub Actions sets an alternative $HOME, so we target the exact internal template path
          args: >-
            document.md
            --output=hello-world.pdf
            --template=/.pandoc/templates/eisvogel.latex
            --listings
            --standalone

      # Step 3: Upload the finished PDF so you can download it
      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdf
          path: hello-world.pdf
